<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的作品集</title>
    <style>
      :root {
        --bg: #0b1120;
        --bg-soft: #111827;
        --panel: rgba(15, 23, 42, 0.8);
        --panel-strong: #111827;
        --card: rgba(17, 24, 39, 0.9);
        --stroke: rgba(148, 163, 184, 0.2);
        --text: #e5e7eb;
        --muted: #cbd5e1;
        --accent: #38bdf8;
        --accent-2: #a78bfa;
        --shadow: rgba(15, 23, 42, 0.45);
      }

      * { box-sizing: border-box; }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", "Noto Sans TC", sans-serif;
        background:
          radial-gradient(circle at top, rgba(56, 189, 248, 0.2), transparent 30%),
          linear-gradient(135deg, var(--bg) 0%, #111827 100%);
        color: var(--text);
        line-height: 1.7;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1180px, 90%);
        margin: 0 auto;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(11, 17, 32, 0.7);
        border-bottom: 1px solid var(--stroke);
        backdrop-filter: blur(10px);
      }

      .nav {
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: #7dd3fc;
      }

      .nav-links {
        display: flex;
        gap: 20px;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .nav-links a:hover {
        color: #fff;
      }

      .hero {
        padding: 78px 0 36px;
      }

      .hero-inner {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 36px;
        align-items: center;
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 18px;
        padding: 8px 14px;
        background: rgba(56, 189, 248, 0.1);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 999px;
        color: #bae6fd;
        font-size: 0.82rem;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.5rem, 5vw, 4.5rem);
        line-height: 1.1;
      }

      .lead {
        margin: 0;
        max-width: 640px;
        color: var(--muted);
        font-size: 1.08rem;
      }

      .stats {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
      }

      .stat {
        min-width: 160px;
        padding: 18px 20px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid var(--stroke);
        border-radius: 18px;
      }

      .stat strong {
        display: block;
        font-size: 2rem;
        color: #fff;
      }

      .stat span {
        color: var(--muted);
      }

      .profile-card {
        padding: 28px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--stroke);
        border-radius: 24px;
        box-shadow: 0 24px 50px var(--shadow);
      }

      .profile-badge {
        width: 140px;
        height: 140px;
        margin: 0 auto 18px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        font-size: 3rem;
        font-weight: 900;
      }

      .profile-card h2 {
        margin: 0;
        text-align: center;
        font-size: 1.8rem;
      }

      .profile-card p {
        margin: 8px 0 0;
        text-align: center;
        color: var(--muted);
      }

      .projects {
        padding: 20px 0 80px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 18px;
        margin-bottom: 24px;
      }

      .section-head h3 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
      }

      .section-head p {
        margin: 0;
        color: var(--muted);
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 22px;
      }

      .project-card {
        position: relative;
        display: block;
        min-height: 290px;
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 22px 40px rgba(15, 23, 42, 0.2);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .project-card:hover {
        transform: translateY(-6px);
        border-color: rgba(125, 211, 252, 0.5);
        box-shadow: 0 30px 48px rgba(15, 23, 42, 0.35);
      }

      .project-cover {
        height: 120px;
        background: linear-gradient(135deg, var(--card-accent), rgba(255,255,255,0.12));
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .project-cover::before {
        content: "";
        position: absolute;
        inset: 18px 20px auto auto;
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.18);
      }

      .project-index {
        position: relative;
        z-index: 1;
        width: 54px;
        height: 54px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: rgba(15, 23, 42, 0.28);
        border: 1px solid rgba(255,255,255,0.22);
        font-size: 1.4rem;
        font-weight: 800;
      }

      .project-body {
        padding: 22px 20px 18px;
      }

      .project-tag {
        display: inline-block;
        margin-bottom: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.12);
        color: #dbeafe;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
      }

      .project-body h4 {
        margin: 0 0 10px;
        font-size: 1.45rem;
      }

      .project-body p {
        margin: 0;
        color: var(--muted);
      }

      .project-link {
        margin-top: 18px;
        color: #7dd3fc;
        font-weight: 700;
      }

      footer {
        padding: 0 0 40px;
        text-align: center;
        color: #94a3b8;
      }

      @media (max-width: 960px) {
        .hero-inner {
          grid-template-columns: 1fr;
        }

        .project-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .nav-links {
          display: none;
        }

        .project-grid {
          grid-template-columns: 1fr;
        }

        .section-head {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container nav">
        <div class="brand">PORTFOLIO</div>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="#works">作品集</a>
          <a href="#about">關於我</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="about">
        <div class="container hero-inner">
          <div>
            <div class="eyebrow">HELLO WORLD</div>
            <h1>我的作品集</h1>
            <p class="lead">
              這裡整理了我在學習與實作中完成的作品，從互動遊戲到工具型頁面，
              都是我一步一步練習與嘗試的成果。
            </p>

            <div class="stats">
              <div class="stat">
                <strong id="projectCount">0</strong>
                <span>作品總數</span>
              </div>
              <div class="stat">
                <strong>4</strong>
                <span>已完成作品</span>
              </div>
            </div>
          </div>

          <div class="profile-card">
            <div class="profile-badge">我</div>
            <h2>成大南工學生</h2>
            <p>熱愛程式設計與前端實作</p>
          </div>
        </div>
      </section>

      <section class="projects" id="works">
        <div class="container">
          <div class="section-head">
            <h3>作品列表</h3>
            <p>目前共有 <strong id="countText">0</strong> 個作品</p>
          </div>

          <div class="project-grid" id="projectGrid"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">© 2026 我的作品集</div>
    </footer>

    <script>
      const projects = [
        { title: '打地鼠遊戲', subtitle: '反應速度挑戰與互動遊戲', link: '1/index.html', color: '#38bdf8' },
        { title: '工程計算機', subtitle: '簡潔實用的計算工具', link: '2/index.html', color: '#34d399' },
        { title: '英文單字測驗', subtitle: '英語學習與答題練習', link: '3/index.html', color: '#f59e0b' },
        { title: '小小火柴人冒險', subtitle: '小型動作冒險遊戲', link: '4/index.html', color: '#f472b6' }
      ];

      const projectCount = projects.length;
      document.getElementById('projectCount').textContent = projectCount;
      document.getElementById('countText').textContent = projectCount;

      const grid = document.getElementById('projectGrid');

      projects.forEach((project, index) => {
        const card = document.createElement('a');
        card.href = project.link;
        card.className = 'project-card';
        card.style.setProperty('--card-accent', project.color);

        card.innerHTML = `
          <div class="project-cover" style="--card-accent: ${project.color};">
            <div class="project-index">${index + 1}</div>
          </div>
          <div class="project-body">
            <span class="project-tag">作品 ${index + 1}</span>
            <h4>${project.title}</h4>
            <p>${project.subtitle}</p>
            <div class="project-link">點擊進入 →</div>
          </div>
        `;

        grid.appendChild(card);
      });
    </script>
  </body>
</html>
