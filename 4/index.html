<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4ec">
  <title>小小火柴人冒險</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25342d;
      --muted: #68776d;
      --paper: #f3f4ec;
      --green: #3e7657;
      --green-dark: #2d5c42;
      --orange: #e5a34d;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(#dfe5d7 1px, transparent 1px) 0 0 / 18px 18px,
        var(--paper);
      font-family: "Avenir Next", Avenir, "Noto Sans TC", sans-serif;
      line-height: 1.55;
    }
    button { font: inherit; }
    .page { width: min(900px, calc(100% - 32px)); margin: auto; padding: 28px 0 36px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 30px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: .82rem; font-weight: 800; letter-spacing: .08em; }
    .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; background: var(--green); color: white; font-size: 1.25rem; }
    .edition { color: var(--muted); font-size: .76rem; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin: 0 0 22px; }
    .eyebrow { margin: 0 0 6px; color: var(--green); font-size: .76rem; font-weight: 800; letter-spacing: .12em; }
    h1 { margin: 0; font: 500 clamp(2rem, 6vw, 3.25rem)/1.1 Georgia, "Noto Serif TC", serif; }
    .intro-copy { max-width: 320px; margin: 0 0 3px; color: var(--muted); font-size: .9rem; }
    .game-card { overflow: hidden; border: 1px solid #dce1d6; border-radius: 12px; background: #fffefa; box-shadow: 0 18px 48px #263b2c12; }
    .game-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid #e7e9e1; }
    .goal { display: flex; align-items: center; gap: 9px; margin: 0; font-size: .9rem; font-weight: 750; }
    .goal-star { color: #dc9839; font-size: 1.2rem; }
    .counter { padding: 5px 12px; border: 1px solid #e3e7dc; border-radius: 999px; color: var(--green-dark); font-size: .85rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stage-wrap { padding: 16px; background: #fafaf5; }
    canvas { display: block; width: 100%; height: auto; border-radius: 8px; background: #d9edcf; touch-action: none; }
    .game-footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 13px 20px 17px; }
    .hint { margin: 0; color: var(--muted); font-size: .8rem; }
    .restart { min-height: 40px; padding: 0 16px; border: 1px solid #d7ded4; border-radius: 6px; background: white; color: var(--ink); cursor: pointer; font-size: .83rem; font-weight: 750; }
    .restart:hover { border-color: var(--green); color: var(--green-dark); }
    button:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
    .touch-controls { display: none; grid-template: repeat(2, 48px) / repeat(3, 48px); justify-content: center; gap: 5px; margin: 18px auto 0; }
    .touch-controls button { border: 1px solid #d7ded4; border-radius: 10px; background: #fffefa; color: var(--green-dark); cursor: pointer; font-size: 1.1rem; touch-action: none; user-select: none; }
    .touch-controls button:active { background: #e4eee2; }
    .touch-controls [data-dir="up"] { grid-area: 1 / 2; }
    .touch-controls [data-dir="left"] { grid-area: 2 / 1; }
    .touch-controls [data-dir="down"] { grid-area: 2 / 2; }
    .touch-controls [data-dir="right"] { grid-area: 2 / 3; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (pointer: coarse), (max-width: 600px) {
      .touch-controls { display: grid; }
    }
    @media (max-width: 560px) {
      .page { width: calc(100% - 24px); padding-top: 19px; }
      .topbar { margin-bottom: 24px; }
      .intro { display: block; }
      .intro-copy { margin-top: 10px; }
      .stage-wrap { padding: 8px; }
      .game-bar { padding: 12px 14px; }
      .game-footer { align-items: start; padding: 12px 14px 15px; }
      .hint { max-width: 210px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>小小遊戲室</span></div>
      <span class="edition">ADVENTURE NO. 04</span>
    </header>
    <section class="intro" aria-labelledby="title">
      <div>
        <p class="eyebrow">準備好出發了嗎？</p>
        <h1 id="title">小小火柴人冒險</h1>
      </div>
      <p class="intro-copy">幫火柴人收集草地上的星星吧！用方向鍵移動，收集全部 5 顆就成功。</p>
    </section>
    <section class="game-card" aria-label="火柴人冒險遊戲">
      <div class="game-bar">
        <p class="goal"><span class="goal-star" aria-hidden="true">★</span>收集草地上的星星</p>
        <div class="counter" aria-live="polite">星星 <span id="score">0</span> / 5</div>
      </div>
      <div class="stage-wrap">
        <canvas id="game" width="960" height="540" aria-label="遊戲場景：使用方向鍵移動火柴人收集五顆星星"></canvas>
      </div>
      <div class="game-footer">
        <p class="hint" id="message">按鍵盤方向鍵開始移動火柴人。</p>
        <button class="restart" id="restart" type="button">重新開始</button>
      </div>
    </section>
    <div class="touch-controls" aria-label="觸控移動方向">
      <button type="button" data-dir="up" aria-label="向上">▲</button>
      <button type="button" data-dir="left" aria-label="向左">◀</button>
      <button type="button" data-dir="down" aria-label="向下">▼</button>
      <button type="button" data-dir="right" aria-label="向右">▶</button>
    </div>
    <p class="sr-only" id="announcement" aria-live="polite"></p>
  </main>
  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const scoreLabel = document.querySelector("#score");
    const message = document.querySelector("#message");
    const announcement = document.querySelector("#announcement");
    const width = canvas.width;
    const height = canvas.height;
    const keys = new Set();
    const starPositions = [
      { x: 145, y: 125 }, { x: 410, y: 95 }, { x: 770, y: 145 },
      { x: 265, y: 390 }, { x: 690, y: 370 }
    ];
    let stars = [];
    const player = { x: width / 2, y: height / 2, speed: 230, jumpStart: null };
    let collected = 0;
    let previousTime = 0;
    let finished = false;

    function drawBackground() {
      ctx.fillStyle = "#d9edcf";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#c5e2b9";
      ctx.beginPath();
      ctx.ellipse(490, 290, 355, 210, -0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#a8cd9d";
      ctx.lineWidth = 3;
      ctx.setLineDash([9, 12]);
      ctx.beginPath();
      ctx.moveTo(90, 295);
      ctx.bezierCurveTo(300, 215, 560, 435, 880, 250);
      ctx.stroke();
      ctx.setLineDash([]);
      for (let i = 0; i < 30; i += 1) {
        const x = (i * 173 + 43) % width;
        const y = (i * 97 + 31) % height;
        ctx.fillStyle = i % 2 ? "#9bc48f" : "#f8f2cf";
        ctx.beginPath();
        ctx.arc(x, y, i % 3 === 0 ? 3 : 2, 0, Math.PI * 2);
        ctx.fill();
      }
      drawBush(70, 75); drawBush(875, 85); drawBush(105, 465); drawBush(855, 455);
    }

    function drawBush(x, y) {
      ctx.fillStyle = "#8dbb7f";
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.arc(x + 22, y + 4, 17, 0, Math.PI * 2);
      ctx.arc(x - 18, y + 8, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#6f9f69";
      ctx.beginPath();
      ctx.arc(x - 5, y - 3, 3, 0, Math.PI * 2);
      ctx.arc(x + 17, y + 8, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawStar(x, y, time) {
      const pulse = 1 + Math.sin(time / 240 + x) * 0.08;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pulse, pulse);
      ctx.fillStyle = "#f3b94f";
      ctx.strokeStyle = "#d89532";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let point = 0; point < 10; point += 1) {
        const radius = point % 2 === 0 ? 16 : 7;
        const angle = -Math.PI / 2 + point * Math.PI / 5;
        const px = Math.cos(angle) * radius;
        const py = Math.sin(angle) * radius;
        if (point === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    function drawPlayer(time) {
      const walking = keys.size > 0 && !finished;
      const swing = walking ? Math.sin(time / 75) * 8 : 0;
      const crouching = keys.has("ArrowDown") && !finished;
      const jumpProgress = player.jumpStart === null ? 1 : Math.min((time - player.jumpStart) / 650, 1);
      if (jumpProgress >= 1) player.jumpStart = null;
      const jumpHeight = player.jumpStart === null ? 0 : Math.sin(jumpProgress * Math.PI) * 95;
      const bob = walking && !crouching ? Math.abs(Math.sin(time / 75)) * 2 : 0;
      const x = player.x;
      const y = player.y - bob - jumpHeight;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1, crouching ? 0.62 : 1);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#26342e";
      ctx.fillStyle = "#26342e";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, -25, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, -15);
      ctx.lineTo(0, 15);
      ctx.moveTo(0, -7);
      ctx.lineTo(-13 - swing, 3);
      ctx.moveTo(0, -7);
      ctx.lineTo(13 + swing, 3);
      ctx.moveTo(0, 15);
      ctx.lineTo(-10 + swing, 31);
      ctx.moveTo(0, 15);
      ctx.lineTo(10 - swing, 31);
      ctx.stroke();
      ctx.restore();
    }

    function render(time) {
      drawBackground();
      stars.forEach((star) => {
        if (!star.collected) drawStar(star.x, star.y, time);
      });
      drawPlayer(time);
      if (finished) {
        ctx.fillStyle = "#25342dcc";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#fffefa";
        ctx.textAlign = "center";
        ctx.font = '700 42px "Avenir Next", sans-serif';
        ctx.fillText("太棒了！全部收集完成", width / 2, height / 2);
        ctx.font = '22px "Avenir Next", sans-serif';
        ctx.fillText("按「重新開始」再玩一次", width / 2, height / 2 + 42);
      }
    }

    function update(time) {
      const delta = previousTime ? Math.min((time - previousTime) / 1000, 0.04) : 0;
      previousTime = time;
      if (!finished) {
        const dx = Number(keys.has("ArrowRight")) - Number(keys.has("ArrowLeft"));
        player.x = Math.max(24, Math.min(width - 24, player.x + dx * player.speed * delta));
        const target = stars.find((star) => !star.collected && Math.hypot(player.x - star.x, player.y - star.y) < 29);
        if (target) {
          target.collected = true;
          collected = stars.filter((star) => star.collected).length;
          scoreLabel.textContent = String(collected);
          if (collected === stars.length) {
            finished = true;
            message.textContent = "太棒了！你收集了全部星星！";
            announcement.textContent = "成功！全部五顆星星都收集完成。";
          } else {
            message.textContent = `好棒！再找到 ${stars.length - collected} 顆星星就完成了。`;
            announcement.textContent = `已收集 ${collected} 顆星星。`;
          }
        }
      }
      render(time);
      requestAnimationFrame(update);
    }

    function resetGame() {
      collected = 0;
      finished = false;
      stars = starPositions.map((star) => ({ ...star, collected: false }));
      player.x = width / 2;
      player.y = height / 2;
      player.jumpStart = null;
      keys.clear();
      scoreLabel.textContent = "0";
      message.textContent = "按鍵盤方向鍵開始移動火柴人。";
      announcement.textContent = "遊戲已重新開始。";
    }

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
        event.preventDefault();
        if (event.key === "ArrowUp") {
          if (!event.repeat && !finished && player.jumpStart === null) player.jumpStart = performance.now();
        } else {
          keys.add(event.key);
        }
      }
    });
    window.addEventListener("keyup", (event) => keys.delete(event.key));
    window.addEventListener("blur", () => keys.clear());
    document.querySelector("#restart").addEventListener("click", resetGame);
    document.querySelectorAll(".touch-controls button").forEach((button) => {
      const direction = `Arrow${button.dataset.dir[0].toUpperCase()}${button.dataset.dir.slice(1)}`;
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        if (direction === "ArrowUp") {
          if (!finished && player.jumpStart === null) player.jumpStart = performance.now();
        } else {
          keys.add(direction);
        }
        button.setPointerCapture(event.pointerId);
      });
      const stop = () => keys.delete(direction);
      button.addEventListener("pointerup", stop);
      button.addEventListener("pointercancel", stop);
      button.addEventListener("lostpointercapture", stop);
    });

    resetGame();
    requestAnimationFrame(update);
  </script>
</body>
</html>
