<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stickman Game</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(#87ceeb, #dff6ff);
      font-family: Arial, sans-serif;
    }

    .game-wrap {
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #333;
      letter-spacing: 2px;
    }

    .score {
      margin-bottom: 12px;
      font-size: 22px;
      font-weight: bold;
      color: #444;
    }

    #gameArea {
      position: relative;
      width: 600px;
      height: 420px;
      border: 4px solid #3f3f3f;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(#a7f0a7, #d8ffb8);
      box-shadow: 0 16px 35px rgba(0,0,0,0.2);
    }

    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;
      background: #5d8c3c;
      border-top: 4px solid #3d642d;
    }

    .tree, .tree::before, .tree::after {
      position: absolute;
      background: #3a7a38;
      border-radius: 50%;
    }

    .tree {
      width: 35px;
      height: 60px;
      bottom: 40px;
      left: 90px;
      background: #7b3d1d;
      border-radius: 8px;
    }

    .tree::before {
      content: "";
      width: 80px;
      height: 80px;
      left: -22px;
      top: -45px;
      background: #3e9d47;
    }

    .tree::after {
      content: "";
      width: 80px;
      height: 80px;
      right: -22px;
      top: -32px;
      background: #3e9d47;
    }

    .star {
      position: absolute;
      width: 18px;
      height: 18px;
      background: gold;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 80% 92%, 50% 70%, 20% 92%, 32% 57%, 2% 35%, 39% 35%);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }

    .stickman {
      position: absolute;
      width: 45px;
      height: 90px;
      left: 50px;
      top: 90px;
      transition: transform 0.08s linear;
    }

    .head {
      position: absolute;
      width: 24px;
      height: 24px;
      left: 10px;
      top: 0;
      background: #1f1f1f;
      border-radius: 50%;
    }

    .body {
      position: absolute;
      width: 6px;
      height: 38px;
      left: 20px;
      top: 24px;
      background: #000;
      border-radius: 4px;
    }

    .arm-left, .arm-right {
      position: absolute;
      width: 30px;
      height: 6px;
      top: 32px;
      background: #000;
      border-radius: 4px;
      transform-origin: left center;
    }

    .arm-left {
      left: 22px;
      transform: rotate(35deg);
    }

    .arm-right {
      left: 22px;
      transform: rotate(-35deg);
    }

    .leg-left, .leg-right {
      position: absolute;
      width: 30px;
      height: 6px;
      top: 58px;
      background: #000;
      border-radius: 4px;
      transform-origin: left center;
    }

    .leg-left {
      left: 20px;
      transform: rotate(35deg);
    }

    .leg-right {
      left: 20px;
      transform: rotate(-35deg);
    }

    .info {
      margin-top: 12px;
      color: #313131;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <h1>火柴人冒險</h1>
    <div class="score">分數：<span id="score">0</span></div>
    <div id="gameArea">
      <div class="tree"></div>
      <div class="star" id="star1" style="left: 440px; top: 120px;"></div>
      <div class="star" id="star2" style="left: 320px; top: 260px;"></div>
      <div class="star" id="star3" style="left: 500px; top: 300px;"></div>

      <div class="stickman" id="stickman">
        <div class="head"></div>
        <div class="body"></div>
        <div class="arm-left"></div>
        <div class="arm-right"></div>
        <div class="leg-left"></div>
        <div class="leg-right"></div>
      </div>

      <div class="ground"></div>
    </div>
    <div class="info">用方向鍵移動，收集星星得分！</div>
  </div>

  <script>
    const stickman = document.getElementById('stickman');
    const scoreEl = document.getElementById('score');
    const gameArea = document.getElementById('gameArea');
    const stars = Array.from(document.querySelectorAll('.star'));

    let player = {
      x: 50,
      y: 90,
      width: 45,
      height: 90,
      speed: 3,
      score: 0,
      crouching: false,
      standingHeight: 90,
      crouchingHeight: 60
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false
    };

    function updatePose() {
      const crouching = keys.ArrowDown;
      const standing = keys.ArrowUp;

      if (crouching) {
        player.crouching = true;
        stickman.style.height = `${player.crouchingHeight}px`;
        stickman.querySelector('.head').style.transform = 'scale(0.9)';
        stickman.querySelector('.body').style.height = '20px';
        stickman.querySelector('.body').style.top = '18px';
        stickman.querySelector('.leg-left').style.top = '38px';
        stickman.querySelector('.leg-right').style.top = '38px';
        stickman.querySelector('.arm-left').style.top = '22px';
        stickman.querySelector('.arm-right').style.top = '22px';
      } else if (standing) {
        player.crouching = false;
        stickman.style.height = `${player.standingHeight}px`;
        stickman.querySelector('.head').style.transform = 'scale(1)';
        stickman.querySelector('.body').style.height = '38px';
        stickman.querySelector('.body').style.top = '24px';
        stickman.querySelector('.leg-left').style.top = '58px';
        stickman.querySelector('.leg-right').style.top = '58px';
        stickman.querySelector('.arm-left').style.top = '32px';
        stickman.querySelector('.arm-right').style.top = '32px';
      } else {
        player.crouching = false;
        stickman.style.height = `${player.standingHeight}px`;
        stickman.querySelector('.head').style.transform = 'scale(1)';
        stickman.querySelector('.body').style.height = '38px';
        stickman.querySelector('.body').style.top = '24px';
        stickman.querySelector('.leg-left').style.top = '58px';
        stickman.querySelector('.leg-right').style.top = '58px';
        stickman.querySelector('.arm-left').style.top = '32px';
        stickman.querySelector('.arm-right').style.top = '32px';
      }
    }

    function updateScore() {
      scoreEl.textContent = player.score;
    }

    function checkStarCollision() {
      stars.forEach(star => {
        const starRect = star.getBoundingClientRect();
        const playerRect = stickman.getBoundingClientRect();

        const overlap = !(
          playerRect.right < starRect.left ||
          playerRect.left > starRect.right ||
          playerRect.bottom < starRect.top ||
          playerRect.top > starRect.bottom
        );

        if (overlap) {
          star.style.display = 'none';
          player.score += 10;
          updateScore();
        }
      });
    }

    function movePlayer() {
      let dx = 0;
      let dy = 0;

      if (keys.ArrowUp) dy -= player.speed;
      if (keys.ArrowDown) dy += player.speed;
      if (keys.ArrowLeft) dx -= player.speed;
      if (keys.ArrowRight) dx += player.speed;

      player.x += dx;
      player.y += dy;

      const maxX = gameArea.clientWidth - player.width;
      const maxY = gameArea.clientHeight - player.height - 40;

      player.x = Math.max(0, Math.min(player.x, maxX));
      player.y = Math.max(0, Math.min(player.y, maxY));

      stickman.style.left = `${player.x}px`;
      stickman.style.top = `${player.y}px`;

      if (dx < 0) {
        stickman.style.transform = 'scaleX(-1)';
      } else if (dx > 0) {
        stickman.style.transform = 'scaleX(1)';
      }

      checkStarCollision();
    }

    document.addEventListener('keydown', (event) => {
      if (event.key in keys) {
        keys[event.key] = true;
        event.preventDefault();
      }
      updatePose();
    });

    document.addEventListener('keyup', (event) => {
      if (event.key in keys) {
        keys[event.key] = false;
      }
      updatePose();
    });

    function loop() {
      movePlayer();
      requestAnimationFrame(loop);
    }

    updateScore();
    updatePose();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
