<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打地鼠遊戲</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        background: linear-gradient(180deg, #dff7ff 0%, #8ad0ff 100%);
        color: #1f2d3d;
      }

      .game-wrapper {
        width: min(90vw, 760px);
        background: rgba(255, 255, 255, 0.8);
        border: 6px solid #d9a441;
        border-radius: 26px;
        box-shadow: 0 18px 35px rgba(60, 90, 120, 0.25);
        padding: 18px 20px 24px;
      }

      .top-bar {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 16px;
        min-height: 56px;
      }

      .title {
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 900;
        letter-spacing: 3px;
        color: #315f9b;
        text-shadow: 2px 2px 0 #fff;
      }

      .player-name {
        position: absolute;
        right: 10px;
        top: 8px;
        font-size: clamp(16px, 2vw, 22px);
        font-weight: 700;
        color: #5a2d0c;
        background: rgba(255, 255, 255, 0.6);
        border: 2px solid #efc76d;
        border-radius: 999px;
        padding: 8px 14px;
      }

      .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        margin-bottom: 18px;
        padding: 12px 18px;
        background: linear-gradient(180deg, #f9fbff, #e8f3ff);
        border: 3px solid #b3d5f5;
        border-radius: 16px;
      }

      .score-box,
      .timer-box {
        font-size: clamp(18px, 3vw, 30px);
        font-weight: 900;
        color: #173d6b;
      }

      .score-box span,
      .timer-box span {
        color: #d66a00;
      }

      .start-btn {
        border: none;
        background: linear-gradient(180deg, #ffcc59, #ff9e2c);
        color: #fff;
        font-size: 20px;
        font-weight: 700;
        padding: 10px 18px;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 6px 0 #d77f12;
        transition: transform 0.1s ease;
      }

      .start-btn:active {
        transform: translateY(2px);
        box-shadow: 0 4px 0 #d77f12;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 18px;
        padding: 12px;
        background: linear-gradient(180deg, #7aa95d, #4b7d36);
        border: 5px solid #594116;
        border-radius: 20px;
      }

      .hole {
        position: relative;
        height: 145px;
        background: linear-gradient(180deg, #7b4a1f, #4a2d16);
        border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
        border: 8px solid #3a2213;
        overflow: hidden;
        cursor: pointer;
      }

      .hole::before {
        content: "";
        position: absolute;
        inset: 18px 18px 0 18px;
        background: radial-gradient(circle at 50% 30%, #6a4221, #3d2615 60%, #25180f);
        border-radius: 50%;
        z-index: 1;
      }

      .mole {
        position: absolute;
        left: 50%;
        bottom: -110px;
        width: 76%;
        height: 90%;
        transform: translateX(-50%);
        transition: bottom 0.2s ease;
        z-index: 2;
      }

      .mole.visible {
        bottom: -18px;
      }

      .mole .head {
        position: absolute;
        width: 70%;
        height: 60%;
        left: 50%;
        bottom: 20%;
        transform: translateX(-50%);
        background: #765234;
        border-radius: 48% 48% 42% 42%;
        box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.1);
      }

      .mole .face {
        position: absolute;
        width: 100%;
        height: 100%;
      }

      .mole .eye {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #000;
        border-radius: 50%;
        top: 32%;
      }

      .mole .eye.left { left: 28%; }
      .mole .eye.right { right: 28%; }

      .mole .nose {
        position: absolute;
        width: 14px;
        height: 10px;
        background: #f4a7a7;
        border-radius: 50% 50% 70% 70%;
        left: 50%;
        top: 40%;
        transform: translateX(-50%);
      }

      .mole .mouth {
        position: absolute;
        width: 26%;
        height: 14px;
        border-bottom: 4px solid #3a2b24;
        border-radius: 0 0 90% 90%;
        left: 50%;
        top: 50%;
        transform: translateX(-50%);
      }

      .mole .hand {
        position: absolute;
        width: 18%;
        height: 22%;
        background: #765234;
        border-radius: 50%;
        bottom: 18%;
      }

      .mole .hand.left { left: 8%; }
      .mole .hand.right { right: 8%; }

      .mole .body {
        position: absolute;
        width: 58%;
        height: 26%;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        background: #8a5d3a;
        border-radius: 50% 50% 20% 20%;
      }

      .mole.hit {
        animation: hit 0.25s ease;
      }

      @keyframes hit {
        0% { transform: translateX(-50%) scale(1); }
        30% { transform: translateX(-50%) scale(1.12); }
        100% { transform: translateX(-50%) scale(0.7); opacity: 0; }
      }

      @media (max-width: 560px) {
        .game-wrapper {
          padding: 12px 12px 18px;
        }

        .hud {
          flex-wrap: wrap;
          justify-content: center;
        }

        .board {
          gap: 12px;
        }

        .hole {
          height: 120px;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-wrapper">
      <div class="top-bar">
        <div class="title">打地鼠</div>
        <div class="player-name">張明玉</div>
      </div>

      <div class="hud">
        <div class="score-box">分數：<span id="score">0</span></div>
        <button class="start-btn" id="startBtn">開始遊戲</button>
        <div class="timer-box">時間：<span id="time">30</span> 秒</div>
      </div>

      <div class="board" id="board">
        <div class="hole" data-index="0"><div class="mole"><div class="head"><div class="face"><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div></div><div class="hand left"></div><div class="hand right"></div><div class="body"></div></div></div></div>
        <div class="hole" data-index="1"><div class="mole"><div class="head"><div class="face"><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div></div><div class="hand left"></div><div class="hand right"></div><div class="body"></div></div></div></div>
        <div class="hole" data-index="2"><div class="mole"><div class="head"><div class="face"><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div></div><div class="hand left"></div><div class="hand right"></div><div class="body"></div></div></div></div>
        <div class="hole" data-index="3"><div class="mole"><div class="head"><div class="face"><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div></div><div class="hand left"></div><div class="hand right"></div><div class="body"></div></div></div></div>
        <div class="hole" data-index="4"><div class="mole"><div class="head"><div class="face"><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div></div><div class="hand left"></div><div class="hand right"></div><div class="body"></div></div></div></div>
        <div class="hole" data-index="5"><div class="mole"><div class="head"><div class="face"><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div></div><div class="hand left"></div><div class="hand right"></div><div class="body"></div></div></div></div>
        <div class="hole" data-index="6"><div class="mole"><div class="head"><div class="face"><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div></div><div class="hand left"></div><div class="hand right"></div><div class="body"></div></div></div></div>
        <div class="hole" data-index="7"><div class="mole"><div class="head"><div class="face"><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div></div><div class="hand left"></div><div class="hand right"></div><div class="body"></div></div></div></div>
        <div class="hole" data-index="8"><div class="mole"><div class="head"><div class="face"><div class="eye left"></div><div class="eye right"></div><div class="nose"></div><div class="mouth"></div></div></div><div class="hand left"></div><div class="hand right"></div><div class="body"></div></div></div></div>
      </div>
    </div>

    <script>
      const board = document.getElementById('board');
      const holes = [...document.querySelectorAll('.hole')];
      const scoreDisplay = document.getElementById('score');
      const timeDisplay = document.getElementById('time');
      const startBtn = document.getElementById('startBtn');

      let score = 0;
      let timeLeft = 30;
      let gameRunning = false;
      let activeHole = null;
      let timerId = null;
      let revealId = null;

      function updateScore() {
        scoreDisplay.textContent = score;
      }

      function updateTime() {
        timeDisplay.textContent = timeLeft;
      }

      function hideMole() {
        holes.forEach((hole) => {
          const mole = hole.querySelector('.mole');
          mole.classList.remove('visible', 'hit');
        });
        activeHole = null;
      }

      function randomHole() {
        const possible = holes.filter((hole) => hole !== activeHole);
        const next = possible[Math.floor(Math.random() * possible.length)];
        return next || holes[0];
      }

      function showMole() {
        if (!gameRunning) return;

        hideMole();
        activeHole = randomHole();
        const mole = activeHole.querySelector('.mole');
        mole.classList.add('visible');

        clearTimeout(revealId);
        revealId = setTimeout(() => {
          if (gameRunning) {
            mole.classList.remove('visible');
            activeHole = null;
          }
        }, 700);
      }

      function whackMole(event) {
        if (!gameRunning) return;

        const hole = event.currentTarget;
        const mole = hole.querySelector('.mole');

        if (!mole.classList.contains('visible')) return;

        mole.classList.remove('visible');
        mole.classList.add('hit');
        score += 1;
        updateScore();

        setTimeout(() => {
          mole.classList.remove('hit');
        }, 200);

        activeHole = null;
      }

      function startGame() {
        score = 0;
        timeLeft = 30;
        updateScore();
        updateTime();
        gameRunning = true;
        startBtn.textContent = '遊戲中';
        startBtn.disabled = true;
        hideMole();

        showMole();

        clearInterval(timerId);
        timerId = setInterval(() => {
          timeLeft -= 1;
          updateTime();

          if (timeLeft <= 0) {
            endGame();
          }
        }, 1000);
      }

      function endGame() {
        gameRunning = false;
        clearInterval(timerId);
        clearTimeout(revealId);
        hideMole();
        startBtn.disabled = false;
        startBtn.textContent = '再玩一次';
        alert('時間到！你的分數是 ' + score + ' 分！');
      }

      holes.forEach((hole) => {
        hole.addEventListener('click', whackMole);
      });

      startBtn.addEventListener('click', () => {
        if (!gameRunning) {
          startGame();
        }
      });

      setInterval(() => {
        if (gameRunning) {
          showMole();
        }
      }, 700);
    </script>
  </body>
</html>
