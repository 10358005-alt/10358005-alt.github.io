<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打地鼠遊戲</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        font-family: "Segoe UI", "Noto Sans TC", sans-serif;
        color: #e2e8f0;
      }

      .game {
        width: min(640px, 90vw);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 22px;
        box-shadow: 0 25px 60px rgba(15, 23, 42, 0.45);
        padding: 24px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }

      .player-name {
        width: 210px;
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid red;
        border-radius: 8px;
        font-size: 2.1rem;
        font-weight: 700;
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
        margin-left: auto;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.4rem);
      }

      .status {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .box {
        min-width: 110px;
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 14px;
        padding: 10px 14px;
        text-align: center;
      }

      .label {
        display: block;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        color: #cbd5e1;
        margin-bottom: 4px;
      }

      .value {
        font-size: 1.8rem;
        font-weight: 800;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        padding: 18px;
        background: linear-gradient(180deg, #4d7c3d, #2f5b2f);
        border-radius: 26px;
        border: 3px solid rgba(15, 100, 54, 0.6);
      }

      .hole {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        background: radial-gradient(circle at 50% 35%, #5b3f2a 0%, #33261d 34%, #1d1715 100%);
        overflow: hidden;
        box-shadow: inset 0 10px 16px rgba(0,0,0,0.35), 0 8px 0 rgba(18,12,10,0.6);
        transition: transform 0.15s ease;
      }

      .hole:hover {
        transform: translateY(-2px);
      }

      .hole::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -10px;
        width: 78%;
        height: 28%;
        transform: translateX(-50%);
        border-radius: 50%;
        background: rgba(0,0,0,0.35);
      }

      .mole {
        position: absolute;
        left: 50%;
        bottom: -110px;
        width: 72%;
        height: 78%;
        transform: translateX(-50%);
        border-radius: 50% 50% 40% 40%;
        background: linear-gradient(180deg, #d9a56d 0%, #b97b48 30%, #765034 100%);
        transition: bottom 0.16s ease;
      }

      .mole::before,
      .mole::after {
        content: "";
        position: absolute;
        top: 24%;
        width: 12%;
        height: 12%;
        background: #111827;
        border-radius: 50%;
      }

      .mole::before { left: 28%; }
      .mole::after { right: 28%; }

      .hole.active .mole,
      .hole.hit .mole {
        bottom: 14px;
      }

      .hole.hit {
        animation: shake 0.2s ease;
      }

      .hole.hit::after {
        content: "✦";
        position: absolute;
        left: 50%;
        top: 8%;
        transform: translateX(-50%);
        font-size: 2rem;
        color: #facc15;
        text-shadow: 0 0 10px rgba(250, 204, 21, 0.8);
      }

      .controls {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }

      button.start {
        border: none;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 1.05rem;
        font-weight: 700;
        background: linear-gradient(135deg, #facc15, #f59e0b);
        color: #1f2937;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(245, 158, 11, 0.3);
      }

      .message {
        display: none;
        text-align: center;
        padding: 18px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 18px;
        margin-top: 20px;
      }

      .message.show {
        display: block;
      }

      .message h2 {
        margin: 0 0 8px;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        50% { transform: translateX(6px); }
        75% { transform: translateX(-3px); }
      }

      @media (max-width: 560px) {
        .game {
          padding: 18px 14px;
        }

        .top {
          flex-direction: column;
          align-items: stretch;
        }

        .status {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="top">
        <h1>打地鼠</h1>
        <div class="player-name">張明鈺</div>
        <div class="status">
          <div class="box">
            <span class="label">分數</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="box">
            <span class="label">時間</span>
            <span id="time" class="value">30</span>
          </div>
          <div class="box">
            <span class="label">最佳</span>
            <span id="best" class="value">0</span>
          </div>
        </div>
      </div>

      <div class="board" id="board">
        <button class="hole" type="button" data-index="0"><span class="mole"></span></button>
        <button class="hole" type="button" data-index="1"><span class="mole"></span></button>
        <button class="hole" type="button" data-index="2"><span class="mole"></span></button>
        <button class="hole" type="button" data-index="3"><span class="mole"></span></button>
        <button class="hole" type="button" data-index="4"><span class="mole"></span></button>
        <button class="hole" type="button" data-index="5"><span class="mole"></span></button>
        <button class="hole" type="button" data-index="6"><span class="mole"></span></button>
        <button class="hole" type="button" data-index="7"><span class="mole"></span></button>
        <button class="hole" type="button" data-index="8"><span class="mole"></span></button>
      </div>

      <div class="controls">
        <button id="startBtn" class="start" type="button">開始遊戲</button>
      </div>

      <div id="message" class="message">
        <h2>時間到！</h2>
        <p>最終分數：<strong id="finalScore">0</strong></p>
        <button id="restartBtn" class="start" type="button">再玩一次</button>
      </div>
    </div>

    <script>
      const scoreEl = document.getElementById('score');
      const timeEl = document.getElementById('time');
      const bestEl = document.getElementById('best');
      const finalScoreEl = document.getElementById('finalScore');
      const startBtn = document.getElementById('startBtn');
      const restartBtn = document.getElementById('restartBtn');
      const messageEl = document.getElementById('message');
      const holes = [...document.querySelectorAll('.hole')];

      const state = {
        score: 0,
        time: 30,
        best: Number(localStorage.getItem('moleBestScore') || 0),
        playing: false,
        activeIndex: null,
        spawnTimer: null,
        countdownTimer: null,
        hideTimer: null,
      };

      function updateUI() {
        scoreEl.textContent = state.score;
        timeEl.textContent = state.time;
        bestEl.textContent = state.best;
      }

      function clearActive() {
        holes.forEach((hole) => {
          hole.classList.remove('active', 'hit');
        });
        state.activeIndex = null;
      }

      function showMole() {
        if (!state.playing) return;

        clearActive();
        const randomIndex = Math.floor(Math.random() * holes.length);
        holes[randomIndex].classList.add('active');
        state.activeIndex = randomIndex;

        clearTimeout(state.hideTimer);
        state.hideTimer = setTimeout(() => {
          if (state.playing) {
            holes[randomIndex].classList.remove('active');
            state.activeIndex = null;
          }
        }, 650);
      }

      function endGame() {
        state.playing = false;
        clearInterval(state.spawnTimer);
        clearInterval(state.countdownTimer);
        clearTimeout(state.hideTimer);
        clearActive();

        state.best = Math.max(state.best, state.score);
        localStorage.setItem('moleBestScore', state.best);
        bestEl.textContent = state.best;
        finalScoreEl.textContent = state.score;
        messageEl.classList.add('show');
      }

      function startGame() {
        state.score = 0;
        state.time = 30;
        state.playing = true;
        messageEl.classList.remove('show');

        clearInterval(state.spawnTimer);
        clearInterval(state.countdownTimer);
        clearTimeout(state.hideTimer);
        clearActive();
        updateUI();

        state.spawnTimer = setInterval(showMole, 700);
        state.countdownTimer = setInterval(() => {
          if (!state.playing) return;

          state.time -= 1;
          updateUI();

          if (state.time <= 0) {
            endGame();
          }
        }, 1000);
      }

      holes.forEach((hole) => {
        hole.addEventListener('click', () => {
          if (!state.playing) return;

          if (hole.classList.contains('active')) {
            hole.classList.remove('active');
            hole.classList.add('hit');
            state.score += 10;
            updateUI();
            state.activeIndex = null;
            setTimeout(() => hole.classList.remove('hit'), 180);
          } else {
            state.score = Math.max(0, state.score - 2);
            updateUI();
          }
        });
      });

      startBtn.addEventListener('click', startGame);
      restartBtn.addEventListener('click', startGame);

      updateUI();
    </script>
  </body>
</html>
