<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>網站計數器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: #fff;
    }
    .card {
      width: min(90vw, 420px);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.25);
      text-align: center;
      backdrop-filter: blur(10px);
    }
    h1 {
      margin: 0 0 20px;
      font-size: 2rem;
    }
    .count {
      font-size: clamp(2.5rem, 7vw, 4rem);
      font-weight: 700;
      margin: 20px 0 28px;
      letter-spacing: 2px;
    }
    button {
      border: none;
      background: linear-gradient(135deg, #facc15, #f59e0b);
      color: #111827;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 14px 26px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 24px rgba(245, 158, 11, 0.35);
    }
    button:hover {
      transform: translateY(-2px);
    }
    .status {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #dbeafe;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>網站瀏覽次數</h1>
    <div class="count" id="count">0</div>
    <button id="incrementBtn">點我加 1</button>
    <div class="status" id="status">讀取中...</div>
  </div>

  <script>
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbx16IqUbEkpByHGv_GxHV5zr_ci2pPoPn3fDia2rYFtckqgIig--76oqTYCHWZltcszng/exec';
    const countEl = document.getElementById('count');
    const statusEl = document.getElementById('status');
    const button = document.getElementById('incrementBtn');

    async function fetchCount(action = 'get') {
      try {
        const response = await fetch(`${scriptUrl}?action=${action}`);
        const data = await response.json();
        countEl.textContent = data.count || 0;
        statusEl.textContent = '已更新';
      } catch (error) {
        console.error(error);
        statusEl.textContent = '資料讀取失敗，請確認 GAS 部署網址是否正確';
      }
    }

    button.addEventListener('click', async () => {
      statusEl.textContent = '更新中...';
      try {
        const response = await fetch(`${scriptUrl}?action=increment`);
        const data = await response.json();
        countEl.textContent = data.count || 0;
        statusEl.textContent = '計數已更新';
      } catch (error) {
        console.error(error);
        statusEl.textContent = '更新失敗，請確認 GAS 部署網址';
      }
    });

    fetchCount();
  </script>
</body>
</html>
