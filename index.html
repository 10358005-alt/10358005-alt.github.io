<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f0" />
    <title>作品集 | 我的創作</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20231f;
        --muted: #777a72;
        --paper: #f6f5f0;
        --surface: #fffefa;
        --line: #e8e6de;
        --accent: #e36d48;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(#deddd5 0.7px, transparent 0.7px) 0 0 / 18px 18px,
          var(--paper);
        font-family: "Avenir Next", Avenir, "Noto Sans TC", sans-serif;
        line-height: 1.55;
      }

      .page {
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: 38px 0 64px;
      }

      .topbar,
      .section-heading,
      .card-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .topbar {
        margin-bottom: clamp(64px, 11vw, 124px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        background: var(--ink);
        color: white;
        font: 1.1rem Georgia, serif;
      }

      .edition,
      .project-type {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 28px;
        margin-bottom: 48px;
      }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--accent);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.14em;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 18px;
        font: 500 clamp(3rem, 8vw, 6.5rem) / 0.98 Georgia, "Noto Serif TC", serif;
        letter-spacing: -0.055em;
      }

      .intro-copy {
        max-width: 440px;
        margin-bottom: 0;
        color: var(--muted);
      }

      .count {
        flex: 0 0 auto;
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 11px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        font-size: 0.8rem;
      }

      .count strong {
        color: var(--accent);
        font: 600 1.5rem Georgia, serif;
      }

      .section-heading {
        gap: 16px;
        margin-bottom: 18px;
      }

      .section-heading h2 {
        margin: 0;
        font-size: 0.88rem;
        font-weight: 750;
      }

      .section-heading span {
        color: var(--muted);
        font-size: 0.78rem;
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .project-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: inherit;
        text-decoration: none;
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      }

      .project-card:hover {
        transform: translateY(-4px);
        border-color: #d7d2c7;
        box-shadow: 0 16px 38px #34382b12;
      }

      .project-card:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .project-art {
        display: grid;
        min-height: 210px;
        place-items: center;
        overflow: hidden;
        position: relative;
      }

      .project-art::before,
      .project-art::after {
        content: "";
        position: absolute;
        border: 1px solid currentColor;
        border-radius: 50%;
        opacity: 0.12;
      }

      .project-art::before {
        width: 230px;
        height: 230px;
      }

      .project-art::after {
        width: 310px;
        height: 310px;
      }

      .project-art span {
        z-index: 1;
        font-size: 4.5rem;
        filter: drop-shadow(0 10px 12px #00000012);
        transition: transform 180ms ease;
      }

      .project-card:hover .project-art span {
        transform: scale(1.08) rotate(-4deg);
      }

      .art-mole {
        color: #355a83;
        background: #dceef0;
      }

      .art-calculator {
        color: #6a5942;
        background: #e8e7e2;
      }

      .art-vocabulary {
        color: #246653;
        background: #e4eee3;
      }

      .art-adventure {
        color: #547b51;
        background: #f0eddd;
      }

      .card-content {
        padding: 20px 22px 18px;
      }

      .card-topline {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .project-number {
        color: var(--accent);
        font: 0.78rem Georgia, serif;
      }

      .card-content h3 {
        margin: 0 0 7px;
        font-size: 1.12rem;
        font-weight: 750;
      }

      .card-content p {
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .card-footer {
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .open-link {
        color: var(--ink);
        font-size: 0.8rem;
        font-weight: 750;
      }

      .arrow {
        color: var(--accent);
        font-size: 1.1rem;
        transition: transform 180ms ease;
      }

      .project-card:hover .arrow {
        transform: translate(3px, -3px);
      }

      footer {
        margin-top: 52px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.75rem;
      }

      @media (max-width: 680px) {
        .page {
          width: min(100% - 32px, 520px);
          padding-top: 24px;
        }

        .topbar {
          margin-bottom: 72px;
        }

        .intro {
          align-items: start;
          flex-direction: column;
          gap: 20px;
          margin-bottom: 34px;
        }

        .project-grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .project-art {
          min-height: 180px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>MY CREATIVE SPACE</span>
        </div>
        <span class="edition">個人作品集</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">作品集 · SELECTED PROJECTS</p>
          <h1 id="page-title">我的作品</h1>
          <p class="intro-copy">收集每一次練習與創作。點選作品圖卡，開始探索。</p>
        </div>
        <div class="count" aria-label="目前共有 4 個作品">
          <strong>04</strong>
          <span>個作品</span>
        </div>
      </section>

      <section aria-labelledby="projects-title">
        <div class="section-heading">
          <h2 id="projects-title">所有作品</h2>
          <span>點擊圖卡進入作品 ↘</span>
        </div>

        <div class="project-grid">
          <a class="project-card" href="1/index.html">
            <div class="project-art art-mole" aria-hidden="true"><span>🐹</span></div>
            <div class="card-content">
              <div class="card-topline">
                <span class="project-number">01</span>
                <span class="project-type">小遊戲</span>
              </div>
              <h3>打地鼠遊戲</h3>
              <p>眼明手快，挑戰你的反應速度。</p>
              <div class="card-footer">
                <span class="open-link">開始遊玩</span>
                <span class="arrow" aria-hidden="true">↗</span>
              </div>
            </div>
          </a>

          <a class="project-card" href="2/index.html">
            <div class="project-art art-calculator" aria-hidden="true"><span>🧮</span></div>
            <div class="card-content">
              <div class="card-topline">
                <span class="project-number">02</span>
                <span class="project-type">工具</span>
              </div>
              <h3>工程計算機</h3>
              <p>方便計算，讓各種運算一鍵完成。</p>
              <div class="card-footer">
                <span class="open-link">開啟工具</span>
                <span class="arrow" aria-hidden="true">↗</span>
              </div>
            </div>
          </a>

          <a class="project-card" href="3/index.html">
            <div class="project-art art-vocabulary" aria-hidden="true"><span>📖</span></div>
            <div class="card-content">
              <div class="card-topline">
                <span class="project-number">03</span>
                <span class="project-type">學習</span>
              </div>
              <h3>英文單字測驗</h3>
              <p>用小測驗複習單字，看看自己記得多少。</p>
              <div class="card-footer">
                <span class="open-link">開始測驗</span>
                <span class="arrow" aria-hidden="true">↗</span>
              </div>
            </div>
          </a>

          <a class="project-card" href="4/index.html">
            <div class="project-art art-adventure" aria-hidden="true"><span>⭐</span></div>
            <div class="card-content">
              <div class="card-topline">
                <span class="project-number">04</span>
                <span class="project-type">小遊戲</span>
              </div>
              <h3>小小火柴人冒險</h3>
              <p>踏上冒險旅程，收集星星並抵達終點。</p>
              <div class="card-footer">
                <span class="open-link">開始冒險</span>
                <span class="arrow" aria-hidden="true">↗</span>
              </div>
            </div>
          </a>
        </div>
      </section>

      <footer>每個作品，都記錄著一次新的嘗試。</footer>
    </main>
  </body>
</html>
